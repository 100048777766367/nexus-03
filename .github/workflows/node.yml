name: Nexus-03 Autogenic Lifecycle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '25 */4 * * *'

permissions:
  contents: write

jobs:
  run-nexus03:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Nexus-03
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Vận hành Vi Nhân Tự Sinh Hóa Nexus-03
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python engine.py

      - name: Lưu vết tích tiến hóa và mã nguồn tự sinh
        run: |
          git config --global user.name "Nexus-03-Autogenic-Bot"
          git config --global user.email "bot@nexus03.node"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git fetch origin main
          git reset origin/main
          # Thêm cả thư mục mechanisms để lưu mã nguồn tự sinh
          git add synapses/ mechanisms/ synapse_backward.json synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🧬 [Nexus-03 F3] Trí tuệ lai Neuro-Symbolic & Tự sinh hóa mã #(1+N) [skip ci]"
            git push origin main
          else
            echo "Mạng lưới tĩnh, không có biến đổi mới."
          fi
